# 家系B: レビュー待ち。PR を作って放置し、人が中身を見てからマージする。
name: Daily Pokefuta Dataset Update

on:
  schedule:
    # Run daily at 10:00 UTC (JST 19:00)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: update-pokefuta
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # ラベル付与に必要

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    # 500件を --sleep 間隔で舐めるので実測 20 分前後。詰まったら落とす。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # このジョブが（間接依存も含めて）呼ぶ自作モジュールすべてのテストを走らせる。
      # 対応表は ast で import を辿って洗い出したもの。スクリプトを1本足したら、
      # その依存も含めて対応する test_*.py をこのリストに足すこと。
      #   実行スクリプト:
      #     update_pokefuta.py            -> test_update_pokefuta.py
      #     generate_prefecture_trivia.py -> test_generate_prefecture_trivia.py
      #     generate_social_posts.py      -> test_generate_social_posts*.py
      #     export_kml.py                 -> test_export_kml.py
      #   内部ライブラリ:
      #     address_parser.py             -> test_address_parser.py
      #     manhole_titles.py             -> test_manhole_titles*.py
      #     prefectures.py                -> test_prefectures.py
      - name: Run scraper tests
        run: |
          python -m unittest discover -s apps/scraper -v \
            -p 'test_address_parser.py'
          python -m unittest discover -s apps/scraper -v \
            -p 'test_manhole_titles*.py'
          python -m unittest discover -s apps/scraper -v \
            -p 'test_prefectures.py'
          python -m unittest discover -s apps/scraper -v \
            -p 'test_update_pokefuta.py'
          python -m unittest discover -s apps/scraper -v \
            -p 'test_generate_prefecture_trivia.py'
          python -m unittest discover -s apps/scraper -v \
            -p 'test_generate_social_posts*.py'
          python -m unittest discover -s apps/scraper -v \
            -p 'test_export_kml.py'

      - name: Run incremental updater
        id: updater
        run: |
          python apps/scraper/update_pokefuta.py \
            --scan-max 500 \
            --out apps/scraper/pokefuta.ndjson \
            --log-level INFO

      - name: Copy active dataset to docs and dist (for GitHub Pages)
        run: |
          # Filter out deleted records for public consumption
          python -c "
          import json
          import os
          with open('apps/scraper/pokefuta.ndjson', 'r', encoding='utf-8') as f:
            active_records = []
            for line in f:
              if line.strip():
                record = json.loads(line)
                if record.get('status') == 'active':
                  active_records.append(record)
          os.makedirs('docs', exist_ok=True)
          with open('docs/pokefuta.ndjson', 'w', encoding='utf-8') as f:
              for record in active_records:
                  json.dump(record, f, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
                  f.write('\n')
          print(f'Wrote {len(active_records)} active records to docs/pokefuta.ndjson')
          "

      - name: Generate KML snapshot
        run: |
          python apps/scraper/export_kml.py \
            --input apps/scraper/pokefuta.ndjson \
            --output docs/pokefuta.kml

      - name: Generate prefecture trivia and social candidates
        run: |
          python apps/scraper/generate_prefecture_trivia.py
          python apps/scraper/generate_social_posts.py

      - name: Detect dataset changes
        id: diff
        run: |
          git add \
            docs/pokefuta.ndjson \
            docs/pokefuta.kml \
            docs/social-post-candidates.json \
            dataset/prefecture_trivia.json || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request (if changes)
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: daily pokefuta dataset update"
          title: "Daily pokefuta dataset update"
          body: |
            Automated daily dataset update with GitHub Pages deployment.
          branch: daily/update-pokefuta-dataset
          labels: |-
            data-update
            automated
          delete-branch: true
          author: GitHub Action <action@github.com>
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes summary (no PR)
        if: steps.diff.outputs.changed == 'false'
        run: echo "No dataset changes detected; nothing to PR."
