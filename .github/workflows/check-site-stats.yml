name: Check Site Stats Freshness

on:
  workflow_dispatch:
  schedule:
    # 05:30 JST の import-manhole-photos.yml（写真取込 + スナップショット生成）と
    # その Pages デプロイが終わってから検証する。統合前より所要時間が伸びたため
    # 07:00 → 08:00 に後ろ倒ししている（検証が生成を追い越すと毎日誤検知するため）。
    - cron: '0 23 * * *' # 08:00 JST

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run unit tests
        run: python3 -m unittest apps.scraper.test_check_site_stats_freshness

      # 本番データのスナップショット監査。データが正当に変わると落ちるのが仕様
      # なので、生成側の update-pokefuta.yml（家系B）ではなく読み取り専用の
      # ここで回す。落ちたら「壊れた」ではなく「期待値を更新せよ」の合図。
      - name: Audit production dataset snapshots
        run: python3 -m unittest discover -s apps/scraper -v -p 'test_dataset_snapshots.py'

      - name: Compare production stats with upstream snapshot
        run: python3 apps/scraper/check_site_stats_freshness.py
