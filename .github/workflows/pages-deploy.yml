# 家系なし: これはデプロイ本体で、家系A・Bが最後に叩く先。
# リポジトリには何も書き込まず（PRもコミットも作らない）、
# docs/ と apps/web/ から dist/ を組み立てて Pages に出すだけ。
name: Build & Deploy Pokefuta Pages (Artifact)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**' # HTML and assets changes
      - 'apps/scraper/generate_sitemap.py' # sitemap generator used during deploy
      - 'apps/scraper/generate_manhole_pages.py' # manhole page generator
      - 'apps/scraper/generate_manhole_pages_i18n.py' # translated manhole pages (/en/manholes/)
      - 'apps/scraper/manhole_page_css.py' # detail page CSS shared by ja / translated pages
      - 'apps/scraper/zukan_cards.py' # shared index card HTML and CSS
      - 'apps/scraper/build_small_images.py' # small WebP lid photos for srcset
      - 'apps/scraper/test_zukan_cards.py' # cross-page card and event regression tests
      - 'apps/scraper/generate_manhole_ogp.py' # OGP image generator
      - 'apps/scraper/generate_pokemon_pages.py' # Pokemon LP generator
      - 'apps/scraper/generate_pokemon_index_page.py' # Pokemon index page generator
      - 'dataset/pokemon_representatives.json' # hand-picked representative manhole per Pokemon (index cards)
      - 'apps/scraper/generate_character_manhole_page.py' # character manhole LP generator
      - 'apps/scraper/generate_character_work_pages.py' # per-work character manhole guides
      - 'apps/scraper/character_manhole_works.py' # shared work page definitions
      - 'apps/scraper/generate_gmanhole_map_page.py' # static Gundam list for gmanhole_map.html
      - 'apps/scraper/generate_summary_pages.py' # summary page generator
      - 'apps/scraper/summary_faq.py' # summary trivia FAQ (ja)
      - 'apps/scraper/generate_summary_ogp.py' # summary page OGP generator
      - 'apps/scraper/generate_prefecture_pages.py' # prefecture page generator
      - 'apps/scraper/generate_prefecture_pages_i18n.py' # translated prefecture pages (/en/prefectures/)
      - 'dataset/municipality_names.json' # municipality names for translated prefecture pages
      - 'apps/scraper/generate_municipality_pages.py' # municipality page generator + ranking
      - 'apps/scraper/visit_durations.py' # measured visit-time text (prefecture + municipality pages)
      - 'dataset/visit_durations.json' # measured visit times, built by apps/tools/build_visit_durations.py
      - 'apps/scraper/generate_trip_pages.py' # /trip/ feature page + per-area trip pages
      - 'dataset/trip_areas.json' # hand-registered trip areas (manhole id sets)
      - 'apps/scraper/features.py' # /features/ data loader (shared with summary + sitemap)
      - 'apps/scraper/generate_feature_pages.py' # /features/ index + per-feature pages
      - 'dataset/features/**' # hand-written features, one JSON per feature
      - 'apps/scraper/municipalities.py' # which municipalities get a page (shared with prefecture/detail/sitemap)
      - 'dataset/municipality_slugs.json' # romanized municipality URL slugs
      - 'dataset/prefecture_municipality_totals.json' # municipality count per prefecture (coverage denominator)
      - 'apps/scraper/generate_tag_pages.py' # theme (tag) landing page generator
      - 'apps/scraper/generate_top_tag_chips.py' # top page theme chips generator
      - 'apps/scraper/generate_top_page.py' # top page counts, photos, prefecture list, JSON-LD
      - 'apps/scraper/generate_top_page_en.py' # en / zh-TW / zh-CN / ko top pages (same layout as the Japanese top)
      - 'apps/scraper/top_page_i18n_text.py' # wording of the multilingual top pages
      - 'apps/scraper/tag_meta.py' # shared theme tag metadata loader
      - 'dataset/tag_meta.json' # single source for theme tags (top / map / tags / summary)
      - 'apps/scraper/inject_site_header.py' # shared header injector
      - 'apps/scraper/inject_adsense.py' # AdSense verification, explicit ad slots, ads.txt
      - 'apps/scraper/generate_prefecture_trivia.py' # prefecture trivia generator
      - 'apps/scraper/generate_top_feed.py' # top page community feed generator
      - 'apps/scraper/prefectures.py' # shared prefecture names, URL slugs and regions
      - 'apps/scraper/display_names.py' # canonical manhole names used by every page generator
      - 'apps/scraper/manhole_tile_image.py' # _lid / _latest choice for small tiles (prefecture + tag pages)
      - 'apps/scraper/manhole_records.py' # record loading / names / distances shared by prefecture, municipality, trip, feature pages
      - 'apps/scraper/page_html.py' # escape / JSON / campaign params / hreflang shared by the same pages
      - 'apps/scraper/prefecture_completion.py' # shared photo-completion rollup (prefectures + summary)
      - 'docs/**'     # dataset changes copied into dist/
      - 'dataset/prefecture_trivia*.json' # generated trivia and editorial sources
      - 'dataset/prefecture_events.json' # prefecture campaign/stamp-rally links
      - 'dataset/prefecture_visit_guides.json' # curated local travel guidance and sources
      - 'dataset/gundam_manhole_spots.json' # curated Pokefuta/Gundam crossover experiences
      - 'dataset/aichi_character_manholes.ndjson' # character manholes shown as nearby design spots
      - 'dataset/idolmaster_20th_manholes.ndjson' # curated Idolmaster manholes
      - 'dataset/shinagawa_cinnamoroll_manholes.ndjson' # curated Shinagawa Cinnamoroll manholes
      - 'dataset/character_manhole_events.json' # time-bounded character manhole events
      - 'dataset/manhole/image/**' # local popup photos
      - 'tools/**'      # i18n build scripts

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Install Japanese fonts (Noto Sans CJK)
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk libcairo2

      - name: Generate per-manhole OGP images
        run: |
          mkdir -p dist/assets/ogp/manholes
          python3 apps/scraper/generate_manhole_ogp.py \
            --manholes docs/pokefuta.ndjson \
            --image-dir dataset/manhole/image \
            --photos docs/latest-manhole-photos.json \
            --pokemon docs/pokemon_metadata.json \
            --output dist/assets/ogp/manholes \
            --force

      - name: Prepare dist directory (site + data)
        env:
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
          ADSENSE_PREFECTURE_SLOT: ${{ secrets.ADSENSE_PREFECTURE_SLOT }}
          ADSENSE_MANHOLE_SLOT: ${{ secrets.ADSENSE_MANHOLE_SLOT }}
          # 設置データに依存するテスト（市区町村 slug の漏れ）をデプロイでは飛ばす。漏れは生成の WARNING で出る
          POKEFUTA_PAGES_DEPLOY: '1'
        run: |
          set -e
          mkdir -p dist/assets
          echo "[dist] Validate generated prefecture trivia"
          python3 apps/scraper/generate_prefecture_trivia.py --check
          echo "[dist] Test prefecture landing page generation"
          python3 -m unittest \
            apps.scraper.test_analytics_contract \
            apps.scraper.test_inject_adsense \
            apps.scraper.test_generate_prefecture_pages \
            apps.scraper.test_generate_prefecture_pages_i18n \
            apps.scraper.test_manhole_tile_image \
            apps.scraper.test_zukan_cards \
            apps.scraper.test_generate_municipality_pages \
            apps.scraper.test_visit_durations \
            apps.scraper.test_build_visit_durations \
            apps.scraper.test_generate_trip_pages \
            apps.scraper.test_generate_feature_pages \
            apps.scraper.test_prefectures \
            apps.scraper.test_web_prefecture_links \
            apps.scraper.test_inject_site_header \
            apps.scraper.test_site_header_css \
            apps.scraper.test_css_grid_tracks \
            apps.scraper.test_generate_summary_pages \
            apps.scraper.test_prefecture_completion
          echo "[dist] Test character manhole landing page generation"
          python3 -m unittest \
            apps.scraper.test_generate_character_manhole_page \
            apps.scraper.test_generate_character_work_pages \
            apps.scraper.test_generate_gmanhole_map_page
          echo "[dist] Test manhole detail page headings"
          python3 -m unittest apps.scraper.test_generate_manhole_pages_h1 apps.scraper.test_generate_manhole_pages_breadcrumb apps.scraper.test_display_name_consumers apps.scraper.test_generate_top_feed apps.scraper.test_generate_manhole_pages_i18n apps.scraper.test_generate_manhole_pages_regional_forms
          echo "[dist] Generate static manhole detail pages"
          python3 apps/scraper/generate_manhole_pages.py
          echo "[dist] Generate translated manhole detail pages (en / zh-TW)"
          for lang in en zh-TW; do
            python3 apps/scraper/generate_manhole_pages_i18n.py --lang "$lang"
          done
          echo "[dist] Test Pokemon LP page content"
          python3 -m unittest apps.scraper.test_generate_pokemon_pages_ja_seo apps.scraper.test_generate_pokemon_pages_hero
          echo "[dist] Generate static Pokemon LP pages"
          python3 apps/scraper/generate_pokemon_pages.py
          echo "[dist] Test Pokemon index page generation"
          python3 -m unittest apps.scraper.test_generate_pokemon_index_page
          echo "[dist] Generate Pokemon index page"
          python3 apps/scraper/generate_pokemon_index_page.py
          echo "[dist] Generate character manhole landing page"
          python3 apps/scraper/generate_character_manhole_page.py --output dist/character_manholes.html
          echo "[dist] Generate character work guides"
          python3 apps/scraper/generate_character_work_pages.py --output dist
          echo "[dist] Generate summary OGP image"
          python3 apps/scraper/generate_summary_ogp.py
          echo "[dist] Generate summary pages (ja/en/zh-CN/zh-TW/ko)"
          python3 apps/scraper/generate_summary_pages.py
          echo "[dist] Generate prefecture landing pages (47 prefectures)"
          python3 apps/scraper/generate_prefecture_pages.py
          echo "[dist] Generate translated prefecture pages (en / zh-TW)"
          for lang in en zh-TW; do
            python3 apps/scraper/generate_prefecture_pages_i18n.py --lang "$lang"
          done
          echo "[dist] Generate municipality landing pages + ranking"
          python3 apps/scraper/generate_municipality_pages.py
          echo "[dist] Generate trip pages (/trip/)"
          python3 apps/scraper/generate_trip_pages.py
          echo "[dist] Generate feature pages (/features/)"
          python3 apps/scraper/generate_feature_pages.py
          echo "[dist] Test theme (tag) metadata and landing page generation"
          python3 -m unittest \
            apps.scraper.test_tag_meta \
            apps.scraper.test_generate_tag_pages \
            apps.scraper.test_generate_top_tag_chips \
            apps.scraper.test_generate_top_page \
            apps.scraper.test_generate_top_page_en
          echo "[dist] Generate theme (tag) landing pages + assets/tag-meta.js"
          python3 apps/scraper/generate_tag_pages.py
          echo "[dist] Test sitemap generation"
          python3 -m unittest apps.scraper.test_generate_sitemap
          echo "[dist] Generate sitemap with manhole + pokemon URLs"
          python3 apps/scraper/generate_sitemap.py
          echo "[dist] Copy HTML sources"
          cp apps/web/index.html dist/index.html
          echo "[dist] Rebuild top page counts, photos, prefecture list and JSON-LD from today's data"
          python3 apps/scraper/generate_top_page.py dist/index.html
          echo "[dist] Rebuild top page theme chips from dataset/tag_meta.json"
          python3 apps/scraper/generate_top_tag_chips.py dist/index.html
          cp apps/web/nearby.html dist/nearby.html  # 廃止済み。map.html へのリダイレクトだけ
          cp apps/web/map.html dist/map.html
          python3 apps/scraper/generate_gmanhole_map_page.py --output dist/gmanhole_map.html  # ガンダムの都道府県別一覧を差し込む
          cp apps/web/design_manhole.html dist/design_manhole.html
          cp apps/web/login.html dist/login.html  # 廃止済み。pokefuta.com/login へのリダイレクトだけ
          cp apps/web/about.html dist/about.html
          cp apps/web/privacy.html dist/privacy.html
          echo "[dist] 404 page (fixed Slowpoke lid)"
          python3 -m unittest apps.scraper.test_404_page
          node apps/web/assets/lid-spin.test.js
          cp apps/web/404.html dist/404.html
          cp apps/web/sitemap.xml dist/sitemap.xml
          cp apps/web/robots.txt dist/robots.txt
          echo "[dist] Build multilingual pages (en / zh-TW / zh-CN / ko)"
          python3 tools/build_i18n.py
          echo "[dist] Replace the English top with the photo-led layout"
          python3 apps/scraper/generate_top_page_en.py dist/en/index.html
          echo "[dist] zh-TW / zh-CN / ko tops use the same photo-led layout (index.en.html with localized text)"
          for lang in zh-TW zh-CN ko; do
            python3 apps/scraper/generate_top_page_en.py --lang "$lang" "dist/$lang/index.html"
          done
          cp apps/web/nearby.html dist/nearby_manholes.html  # 旧 URL も map.html へ
          echo "[dist] Inject shared site header into every HTML page"
          python3 apps/scraper/inject_site_header.py dist
          echo "[dist] Inject AdSense verification and in-content slots when configured"
          python3 apps/scraper/inject_adsense.py dist
          echo "[dist] Copy assets (CSS + images)"
          cp -r apps/web/assets/* dist/assets/ || true
          # Root fallbacks for browsers/crawlers; explicit links use /assets/.
          cp apps/web/assets/favicon.ico dist/favicon.ico
          cp apps/web/assets/brand-icon.svg dist/icon.svg
          cp apps/web/assets/apple-touch-icon.png dist/apple-touch-icon.png
          echo "[dist] Copy local manhole photos"
          mkdir -p dist/manhole/image
          cp -r dataset/manhole/image/* dist/manhole/image/ || true
          echo "[dist] Build small WebP versions of lid photos (srcset in index pages)"
          # ページは {id}_lid_180.webp などを srcset で指しているので、作れなければここで止める
          python3 apps/scraper/build_small_images.py dist/manhole/image
          echo "[dist] Copy public dataset from docs/ (generated by update-pokefuta.yml)"
          cp docs/pokefuta.ndjson dist/pokefuta.ndjson || true
          # KML は map.html のフッタからリンクしている配布物なので、
          # 失敗を握りつぶすと 404 のままデプロイが成功してしまう
          cp docs/pokefuta.kml dist/pokefuta.kml
          cp docs/gmanhole.ndjson dist/gmanhole.ndjson || true
          cp docs/character_manholes.ndjson dist/character_manholes.ndjson
          cp docs/design_manholes.ndjson dist/design_manholes.ndjson
          cp docs/latest-manhole-photos.json dist/latest-manhole-photos.json
          cp docs/pokemon_metadata.json dist/pokemon_metadata.json || true
          echo "[dist] Copy app data snapshot (generated by import-manhole-photos.yml)"
          mkdir -p dist/api
          cp docs/api/*.json dist/api/
          echo "[dist] Copy prefecture event notices"
          cp dataset/prefecture_events.json dist/api/prefecture_events.json
          echo "[dist] Generate top page community feed"
          python3 apps/scraper/generate_top_feed.py --output dist/api/top-feed.json
          echo "[dist] Listing dist contents"
          find dist -maxdepth 2 -type f -print | sort

      - name: Reject loopback URLs in Pages artifact
        run: |
          python3 .github/scripts/check_production_urls.py \
            --exclude 'supabase-ssr.js' \
            dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
