<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- 図鑑独自のログインページは廃止した。ログインはヘッダーと同じく写真館（pokefuta.com/login）に一本化。
       ?redirect= は data.pokefuta.com 内の行き先だけ、完全な URL にして引き継ぐ（写真館側は https://data.pokefuta.com/ で始まる URL を許可している） -->
  <title>ログイン | ポケふた写真館へ移動します</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://pokefuta.com/login?from=data&amp;mode=login">
  <script>
    (function () {
      var target = 'https://pokefuta.com/login?from=data&mode=login';
      var redirect = new URLSearchParams(location.search).get('redirect');
      if (redirect) {
        try {
          var url = new URL(redirect, location.origin);
          if (url.origin === 'https://data.pokefuta.com') target += '&redirect=' + encodeURIComponent(url.href);
        } catch (e) { /* 壊れた redirect は捨てる */ }
      }
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p><a href="https://pokefuta.com/login?from=data&amp;mode=login">ポケふた写真館のログインページ</a>へ移動します。</p>
</body>
</html>
