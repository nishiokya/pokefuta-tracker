  </main>
  <script>
    // 有名なポケモンが1体だけ描かれたポケふたを、ポケモンごとに等しい確率で1枚選ぶ
    // （ヤドンのように枚数の多いポケモンばかり出ないように、先にポケモンを選ぶ）
    (function () {
      var items;
      try { items = JSON.parse(document.getElementById('lost-data').textContent).items || []; } catch (e) { items = []; }
      if (!items.length) return;
      var byPokemon = {};
      items.forEach(function (it) { (byPokemon[it.pokemon] = byPokemon[it.pokemon] || []).push(it); });
      var names = Object.keys(byPokemon);
      var current = null;
      function pick() {
        var choices = names.length > 1 && current ? names.filter(function (n) { return n !== current.pokemon; }) : names;
        var list = byPokemon[choices[Math.floor(Math.random() * choices.length)]];
        current = list[Math.floor(Math.random() * list.length)];
        document.getElementById('lost-pick').href = './manholes/' + encodeURIComponent(current.id) + '/';
        var lid = document.getElementById('lost-lid');
        lid.src = './manhole/image/' + encodeURIComponent(current.id) + '_lid.jpeg';
        lid.alt = current.pokemon + 'のポケふた';
        document.getElementById('lost-pokemon').textContent = current.pokemon;
        document.getElementById('lost-place').textContent = current.place;
      }
      pick();
      var more = document.getElementById('lost-more');
      more.hidden = names.length < 2;
      more.addEventListener('click', function () {
        pick();
        window.trackEvent('click_not_found_shuffle', { surface: 'not_found', pokemon: current.pokemon });
      });
    })();
  </script>
</body>
</html>
